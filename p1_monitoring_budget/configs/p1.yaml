# Project 1 config: this file is the single source of truth for my experiments.

dataset:
  name: NF-UNSW-NB15-v2
  parquet: data/processed/nf_unsw_nb15_v2.parquet
  label_binary: Label        # 0 = benign, 1 = attack
  label_multiclass: Attack

# Columns the models never use (IDs, IPs, ports, labels).
excluded_features:
  - IPV4_SRC_ADDR
  - IPV4_DST_ADDR
  - L4_SRC_PORT
  - Label
  - Attack
  - DNS_QUERY_ID

# Columns dropped in the main runs.
# TTL separates attacks from benign flows too well, and the dataset authors dropped it too.
main_run_drop:
  - MIN_TTL
  - MAX_TTL

# A second run keeps these columns, to show how much they change the results.
sensitivity_run_keep:
  - MIN_TTL
  - MAX_TTL

# Checked on Day 2: removing these changed recall by less than 0.001, so they stay in the main run.
checked_and_kept:
  - MIN_IP_PKT_LEN
  - DNS_TTL_ANSWER
  
split:
  type: stratified    # no timestamp in the file, so no split by time
  test_size: 0.3      # share of all data used for testing
  scorer_size: 0.1    # share of all data used only for the policy D scorer
  seed: 0             # the split is fixed, the 5 seeds change sampling and models

seeds: [0, 1, 2, 3, 4]

budgets: [1.0, 0.5, 0.2, 0.1, 0.05, 0.01, 0.001]

sampling:
  policies: [uniform, host_keyed, stratified, attack_aware]
  # I key policy B on the (src, dst) pair because only 40 source IPs exist.
  host_key_columns: [IPV4_SRC_ADDR, IPV4_DST_ADDR]
  min_per_stratum: 1   # smallest number of flows kept from each stratum

campaigns:
  # Primary definition: (attack class, source IP, destination IP).
  primary_columns: [Attack, IPV4_SRC_ADDR, IPV4_DST_ADDR]
  min_flows: 10
  # Sensitivity check: the coarser (attack class, source IP) definition.
  coarse_columns: [Attack, IPV4_SRC_ADDR]

models:
  logreg:
    max_iter: 1000
  random_forest:
    n_estimators: 100
    max_depth: 20
    n_jobs: -1
  lightgbm:
    n_estimators: 200
    learning_rate: 0.1
    num_leaves: 31

training:
  class_weight: balanced   # gives attack flows more weight in training only; the test set is not changed